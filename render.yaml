services:
  - type: web
    name: divinos
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_STRIPE_MEMBERSHIP_URL
        sync: false
      - key: VITE_STRIPE_RENTAL_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
